<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="boxTop" x1="16" y1="12" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="16" y1="28" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boxRight" x1="48" y1="28" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Badge -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Isometric Packaging Box -->
  <!-- Top Face -->
  <path d="M32 14 L50 24 L32 34 L14 24 Z" fill="url(#boxTop)" />
  <!-- Left Face -->
  <path d="M14 24 L32 34 L32 52 L14 42 Z" fill="url(#boxLeft)" />
  <!-- Right Face -->
  <path d="M32 34 L50 24 L50 42 L32 52 Z" fill="url(#boxRight)" />
  
  <!-- Seam Tape / Order Tape in Lime Accent -->
  <path d="M26 17.5 L38 24.2 L38 27.2 L26 20.5 Z" fill="#bef264" opacity="0.9" />
  
  <!-- AI Core Sparkle -->
  <circle cx="48" cy="16" r="3" fill="#a3e635" filter="url(#glow)" />
  <path d="M48 10 L48 22 M42 16 L54 16" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
</svg>
